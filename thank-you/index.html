<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Timbertop Fencing by Chris</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17717686162"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17717686162');
    </script>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1a5fb4;
            --accent-green: #4CAF50;
            --dark: #0a0a0a;
            --light: #fff;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--dark);
            overflow-x: hidden;
            background: #f8f9fa;
        }

        .thank-you-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .thank-you-content {
            max-width: 600px;
            text-align: center;
            background: var(--light);
            padding: 4rem 3rem;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .thank-you-icon {
            font-size: 4rem;
            color: var(--accent-green);
            margin-bottom: 1.5rem;
        }

        .thank-you-content h1 {
            font-size: clamp(2rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--dark);
        }

        .thank-you-content p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .home-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: var(--accent-green);
            color: var(--light);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .home-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
            background: #45a049;
        }

        footer {
            background: var(--dark);
            color: var(--light);
            text-align: center;
            padding: 2rem;
        }

        footer a {
            color: var(--light);
            text-decoration: none;
            margin: 0 1rem;
        }

        footer a:hover {
            color: var(--accent-green);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .thank-you-content {
            animation: fadeInUp 0.8s ease-out;
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="thank-you-content">
            <i class="fas fa-check-circle thank-you-icon"></i>
            <h1>Thank You!</h1>
            <p>Your message has been received successfully. We'll get back to you as soon as possible.</p>
            <a href="/" class="home-button">Return to Home</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Timbertop Fencing. Owned & Operated by Chris.</p>
        <p style="margin-top: 0.5rem; font-size: 0.9rem;"><i class="fas fa-map-marker-alt"></i> Based on the Sunshine Coast | Servicing the Sunshine Coast Region</p>
        <div style="margin-top: 1rem;">
            <a href="/">Home</a>
            <a href="/colorbond-fencing">Colorbond</a>
            <a href="/timber-fencing">Timber</a>
            <a href="/aluminium-fencing">Aluminium</a>
            <a href="/retaining-walls">Retaining Walls</a>
        </div>
    </footer>
</body>
</html>
